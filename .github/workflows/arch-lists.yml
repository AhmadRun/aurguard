name: Collect Arch mailing-list malware reports

on:
  schedule:
    - cron: "7 */6 * * *"    # every 6 hours, 24/7
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arch-lists
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read aur-requests + aur-general feeds
        run: python tools/collect_arch_lists.py
      - name: Commit new reports
        run: |
          git config user.name "aurguard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed/arch-lists.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "feed: Arch mailing-list malware reports"
          git pull --rebase
          git push
